# THEME (S-14): They didn't administer the estate — they consumed it, and
# every hour of the consuming went on a bill.
#
# The scenario's spine, from the ranked gather:
#   THEIR frame — the probate court reviewed and approved every fee and the
#   Court of Appeals affirmed (Recon. Ruling p.2); Marie's parade of lawyers
#   and frivolous objections drove the costs (Reply Brief p.12 quoting him);
#   the auction was in the approved plan of administration and Marie had two
#   months to object (Phillips MSD p.4); the second fee award was for
#   DEFENDING the estate under MCL 700.3720 (Recon. p.2); the court sanctioned

[package]
name = "colossus-chat"
version = "0.1.0"
edition = "2021"
description = "A case-blind chat engine over the Anthropic Messages API: streaming, prompt caching, citation-enabled documents, a bounded tool loop, and server-side compaction. Everything specific to a project enters as configuration and data."
publish = false

# ## Why these, and why these versions
#
# Every dependency here is ALREADY in the backend's lockfile at the same major
# version, so adding this crate compiles no new third-party code. `reqwest` is
# 0.13 because that is the client the backend's streaming engine was built on
# (see `backend/Cargo.toml`, the `reqwest_13` entry: 0.12 hangs inside Podman
# against api.anthropic.com without `.http1_only()`, and the 0.13 instance is the
# one that carries it). Cargo unifies features across the workspace, so the TLS
# features rig-core enables on 0.13 apply here too.
[dependencies]
reqwest = { version = "0.13" }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
# The keep-warm rules (`keepwarm`) reason about a local day and a local window,
# so they need a timezone-aware clock. Both are already in the lockfile at these
# versions (chrono 0.4.44, chrono-tz 0.8.6), so nothing new compiles.
chrono = "0.4"
chrono-tz = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
